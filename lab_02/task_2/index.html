<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seasons</title>
  <style>
    body { margin: 24px; font: 20px/1.45 Arial, sans-serif; }
    .seasons { list-style-image: url("images/arrow-right_16.png"); }
    .snowflake { list-style-image: url("images/snowflake_16.png"); }
    .leaf_g { list-style-image: url("images/leaf_g_16.png"); }
    .sun { list-style-image: url("images/sun_16.png"); }
    .leaf_y { list-style-image: url("images/leaf_y_16.png"); }
  </style>
</head>
<body>
  <ul class="seasons" aria-label="Seasons of the year">
    <li>Winter
      <ul class="snowflake">
        <li>December</li>
        <li>January</li>
        <li>February</li>
      </ul>
    </li>
    <li>Spring
      <ul class="leaf_g">
        <li>March</li>
        <li>April</li>
        <li>May</li>
      </ul>
    </li>
    <li>Summer
      <ul class="sun">
        <li>June</li>
        <li>July</li>
        <li>August</li>
      </ul>
    </li>
    <li>Autumn
      <ul class="leaf_y">
        <li>September</li>
        <li>October</li>
        <li>November</li>
      </ul>
    </li>
  </ul>
</body>
</html>
