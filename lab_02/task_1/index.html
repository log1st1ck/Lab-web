<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fruit List</title>
  <style>
    body { margin: 24px; color: white; font: 18px Arial, sans-serif; }
    .fruit-list { max-width: 420px; padding: 24px 24px 24px 52px; background: #ef9eaf; }
    .fruit-list li { margin-block: 8px; background: #c36478; list-style-position: inside; padding-left: 10px; }
    .fruit-list li span { display: inline-block; padding: 9px 12px; background: #984357; }
  </style>
</head>
<body>
  <ol class="fruit-list" aria-label="Fruit list">
    <li><span>Apple</span></li>
    <li><span>Orange</span></li>
    <li><span>Pineapple</span></li>
    <li><span>Pear</span></li>
    <li><span>Cherry</span></li>
  </ol>
</body>
</html>
