<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Рамка з псевдоелементами</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #fff; }
    .frame, body.single-image {
      --side: min(58vmin, 352px);
      --border: clamp(6px, 2vmin, 14px);
      position: relative;
      isolation: isolate;
      height: min(90vmin, 560px);
    }
    .frame img, .single-image img, .frame::before, .frame::after, .single-image::before, .single-image::after {
      position: absolute;
      box-sizing: border-box;
      top: 50%;
      left: 50%;
      width: var(--side);
      height: var(--side);
    }
    .frame img, .single-image img {
      z-index: 1;
      border: var(--border) solid #efefef;
      object-fit: cover;
      transform: translate(-50%, -50%);
    }
    /* img is a replaced element, so its parent paints the generated boxes. */
    .frame::before, .frame::after, .single-image::before, .single-image::after {
      content: "";
      pointer-events: none;
      border: solid #f5adad;
      border-width: var(--border);
      transform: translate(-50%, -50%) rotate(45deg);
    }
    .frame::after, .single-image::after {
      z-index: 2;
      border-top-color: transparent;
      border-bottom-color: transparent;
    }
  </style>
</head>
<body class="single-image">
  <img src="img/flowers.jpg" alt="Квіти та весільні обручки">
</body>
</html>
