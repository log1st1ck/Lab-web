<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Галерея зображень</title>
  <style>
    body { margin: 24px; font: 16px Arial, sans-serif; }
    main { max-width: 900px; margin: auto; text-align: center; }
    .stage { position: relative; aspect-ratio: 3 / 2; overflow: hidden; border-radius: 12px; box-shadow: 0 2px 10px #0006; }
    .slide { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; visibility: hidden; }
    .slide:first-child { visibility: visible; }
    .stage:has(.slide:target) .slide:first-child:not(:target) { visibility: hidden; }
    .slide:target { visibility: visible; }
    .thumbs { display: flex; justify-content: center; gap: clamp(5px, 2vw, 16px); margin-top: 16px; }
    .thumbs a { flex: 0 1 150px; min-width: 0; }
    .thumbs img { display: block; width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: cover; border-radius: 8px; box-shadow: 0 2px 7px #0006; }
    .thumbs a:focus-visible { outline: 3px solid #286491; outline-offset: 3px; border-radius: 8px; }
  </style>
</head>
<body>
  <main>
    <h1>Галерея зображень</h1>
    <div class="stage">
      <img class="slide" id="lake" src="img/lake.jpg" alt="Гірське озеро" width="900" height="600">
      <img class="slide" id="wave" src="img/wave.jpg" alt="Морська хвиля" width="900" height="600">
      <img class="slide" id="lagoon" src="img/lagoon.jpg" alt="Тропічна лагуна" width="900" height="600">
      <img class="slide" id="garden" src="img/garden.jpg" alt="Осінній сад" width="900" height="600">
      <img class="slide" id="waterfall" src="img/waterfall.jpg" alt="Водоспад" width="900" height="600">
    </div>
    <nav class="thumbs" aria-label="Вибір зображення">
      <a href="#lake"><img src="img/lake-thumb.jpg" alt="Гірське озеро" width="150" height="100"></a>
      <a href="#wave"><img src="img/wave-thumb.jpg" alt="Морська хвиля" width="150" height="100"></a>
      <a href="#lagoon"><img src="img/lagoon-thumb.jpg" alt="Тропічна лагуна" width="150" height="100"></a>
      <a href="#garden"><img src="img/garden-thumb.jpg" alt="Осінній сад" width="150" height="100"></a>
      <a href="#waterfall"><img src="img/waterfall-thumb.jpg" alt="Водоспад" width="150" height="100"></a>
    </nav>
  </main>
</body>
</html>
