  </main>
  <script>
    const tree = document.querySelector(".tree");
    const zones = Array.from(document.querySelectorAll("area"), (area) => ({
      area,
      coords: area.coords.split(",").map(Number)
    }));
    new ResizeObserver(() => {
      const scaleX = tree.clientWidth / 722;
      const scaleY = tree.clientHeight / 548;
      for (const {area, coords} of zones) {
        area.coords = coords.map((value, i) => Math.round(value * (i % 2 ? scaleY : scaleX))).join(",");
      }
    }).observe(tree);
  </script>
